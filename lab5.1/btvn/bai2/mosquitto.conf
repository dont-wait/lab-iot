# Cau hinh Mosquitto cho Gateway - Bai 2

# Cho phep cac sensor node trong LAN ket noi toi Gateway.
listener 1883 0.0.0.0

# Bat buoc client phai dang nhap.
allow_anonymous false
password_file ./passwd
acl_file ./aclfile

# Khong luu persistence de bai thuc hanh tap trung vao xac thuc.
persistence false
connection_messages true
log_type all
