# Mosquitto local broker for Lab 5.1
# Chay tren Gateway/Raspberry Pi trong mang LAN.

# Nhan ket noi MQTT tren cong mac dinh.
listener 1883 0.0.0.0
protocol mqtt

# Chi dung cho bai thuc hanh trong mang tin cay.
# Bai 2 (ve nha) se thay the bang allow_anonymous false.
allow_anonymous true

# Luu tru va log de de kiem tra trong qua trinh hoc.
persistence false
log_type all
connection_messages true

